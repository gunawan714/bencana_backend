<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B3D91">
<title>BANDUL Admin — Monitoring</title>
<link rel="icon" href="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B3D91;--bl:#EEF4FF;--red:#D62828;--rl:#FFF0F0;--green:#2DC653;--gd:#1A9E3F;--gl:#EDFBF2;--amber:#F4A261;--al:#FFF6EE;--ink:#0D1B2A;--mid:#3D5166;--soft:#7A94AB;--bg:#F4F7FB;--bd:rgba(11,61,145,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3,button,th{font-family:Poppins,sans-serif}
button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.hide{display:none!important}
aside{width:240px;background:linear-gradient(180deg,#0B3D91,#07285F);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:100;display:flex;flex-direction:column;transition:transform .3s;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}.brand h1{font-size:1rem;line-height:1.1}.brand span{font-size:.65rem;opacity:.7}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.75);font-size:.82rem;font-weight:600;width:100%;text-align:left;margin-bottom:3px}
.nl i{width:18px;text-align:center}.nl:hover{background:rgba(255,255,255,.08)}.nl.on{background:rgba(255,255,255,.16);color:#fff}
.nl b{margin-left:auto;background:var(--red);font-size:.62rem;padding:1px 8px;border-radius:50px}
main{margin-left:240px;padding:20px 24px 40px;max-width:1300px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top div.t{flex:1;min-width:180px}.top h2{font-size:1.4rem}.top p{font-size:.8rem;color:var(--soft)}
.conn{font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:50px;background:var(--gl);color:var(--gd)}
.ham{display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1.5px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.sc{background:#fff;border:1.5px solid var(--bd);border-radius:20px;padding:16px}
.sc i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sc h3{font-size:1.6rem;line-height:1.1}.sc p{font-size:.72rem;color:var(--soft);font-weight:600}.sc small{font-size:.68rem;color:var(--gd);font-weight:600}
.panel{background:#fff;border:1.5px solid var(--bd);border-radius:20px;margin-bottom:16px;overflow:hidden}
.ph{padding:14px 18px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ph h3{font-size:.95rem;flex:1}
.pb{padding:16px 18px}.cw{position:relative;height:260px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px}.bar input{flex:1;min-width:170px;margin:0}.bar select{width:auto;margin:0}.bar small{color:var(--soft);font-size:.72rem}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:.85rem;background:#fff;outline:0;margin-bottom:10px}
input:focus,select:focus{border-color:var(--blue)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:10px 14px;background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--bd);color:var(--mid)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--bl)}
.empty{text-align:center;color:var(--soft);padding:40px!important;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:50px;font-size:.76rem;font-weight:700;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.b1{background:var(--blue);color:#fff}.b2{background:var(--green);color:#fff}.b3{background:var(--amber);color:#fff}.b4{background:#fff;border:1.5px solid var(--bd);color:var(--mid)}.b5{background:var(--red);color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:50px;font-size:.68rem;font-weight:700;white-space:nowrap}
.pill.red{background:var(--rl);color:var(--red)}.pill.green{background:var(--gl);color:var(--gd)}.pill.amber{background:var(--al);color:#C45F00}.pill.blue{background:var(--bl);color:var(--blue)}.pill.gray{background:#EEF1F5;color:var(--soft)}
.ov{position:fixed;inset:0;background:rgba(13,27,42,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}.ov.on{display:flex}
.md{background:#fff;border-radius:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
.mh{padding:16px 20px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center}.mh h3{flex:1;font-size:1rem}
.dr{padding:9px 20px;border-bottom:1px solid var(--bd);font-size:.84rem}.dr small{display:block;font-size:.66rem;font-weight:700;color:var(--soft);text-transform:uppercase}.dr span{word-break:break-word}
.mf{padding:14px 20px 20px;display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;top:16px;right:16px;background:var(--ink);color:#fff;font-size:.8rem;padding:11px 18px;border-radius:50px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}#toast.on{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2 .panel{margin-bottom:0;min-width:0}
.sim-badge{font-size:.66rem;font-weight:700;padding:5px 12px;border-radius:50px;background:var(--al);color:#C45F00;border:1px dashed rgba(196,95,0,.4)}
/* ══ PETA ══ */
#map{height:430px;width:100%;border-radius:14px;position:relative;z-index:0;background:#e7edf5}
.leaflet-container{font-family:Inter,sans-serif;border-radius:14px}
.leaflet-popup-content{font-size:.78rem;line-height:1.5;margin:10px 12px}
.map-dot{position:relative;display:block;width:18px;height:18px}
.map-dot .ring{position:absolute;inset:0;border-radius:50%;background:rgba(214,40,40,.5);animation:ping 1.7s cubic-bezier(0,0,.2,1) infinite}
.map-dot .core{position:absolute;inset:4px;border-radius:50%;background:#D62828;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
@keyframes ping{0%{transform:scale(.35);opacity:.95}80%,100%{transform:scale(2.1);opacity:0}}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.on{transform:none}main{margin-left:0;padding:14px}.ham{display:block}#map{height:340px}}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <div class="brand"><img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt=""><div><h1>BANDUL Admin</h1><span>Monitoring · Banten Peduli</span></div></div>
    <nav id="nav"></nav>
    <div style="margin-top:auto;padding-top:14px">
      <div id="who" style="font-size:.68rem;opacity:.7;word-break:break-all;margin-bottom:8px">admin@bandul.id</div>
      <button class="nl" id="reset"><i class="fas fa-rotate"></i> Reset Data Simulasi</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="ham" id="ham" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <div class="t"><h2 id="title">Dashboard</h2><p id="sub"></p></div>
      <span class="sim-badge" id="conn"><i class="fas fa-flask"></i> Simulasi Aktif</span>
      <button class="btn b4" id="exp"><i class="fas fa-file-csv"></i> Export CSV</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   BANDUL ADMIN — MODE SIMULASI
   · Tanpa halaman login, langsung ke dashboard
   · Peta Banten (Leaflet + OpenStreetMap, tanpa API key)
   · Data FIKTIF untuk uji tampilan & alur operasional
   Untuk produksi: ganti blok SIMULASI dengan listener Firestore.
   ═══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; const toast = (m, ms = 3500) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms); };
const dt = ts => ts && ts.toDate ? ts.toDate() : ts ? new Date(ts) : null;
const tm = ts => { const d = dt(ts); return d ? d.toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; };
const ago = ts => { const d = dt(ts); if (!d) return '—'; const s = (Date.now() - d.getTime()) / 1000; if (s < 60) return 'baru saja'; if (s < 3600) return Math.floor(s/60) + ' mnt lalu'; if (s < 86400) return Math.floor(s/3600) + ' jam lalu'; return Math.floor(s/86400) + ' hari lalu'; };
const pill = (t, c = 'blue') => `<span class="pill ${c}">${esc(t || '—')}</span>`;
const stPill = s => pill(s || 'baru', { baru:'red', diproses:'amber', selesai:'green' }[s || 'baru'] || 'gray');
const mp = r => r.lat ? `<a href="https://www.google.com/maps?q=${esc(r.lat)},${esc(r.lng)}" target="_blank" rel="noopener" style="color:var(--blue)">📍 ${esc(r.lokasi || 'Peta')}</a>` : '—';
const who = r => esc(r.email || 'Anonim');

/* ═══ DEFINISI KOLEKSI ═══ */
const COL = {
  reports:          { t:'Laporan Darurat',     i:'fa-file-medical',        sub:'Semua laporan bencana yang masuk', st:1, cols:[['Waktu',r=>tm(r.createdAt)],['Pelapor',who],['Jenis',r=>pill(r.jenis)],['Lokasi',mp],['Audio',r=>r.audio?'🎙️':'—'],['Status',r=>stPill(r.status)]] },
  layanan_requests: { t:'Permintaan Layanan',  i:'fa-hands-holding-heart', sub:'Permintaan bantuan medis & sosial', st:1, cols:[['Waktu',r=>tm(r.createdAt)],['Pemohon',who],['Layanan',r=>pill(r.jenis,'amber')],['WA Tujuan',r=>r.waTarget?`<a href="https://wa.me/${esc(r.waTarget)}" target="_blank" rel="noopener" style="color:var(--gd)">${esc(r.waTarget)}</a>`:'—'],['Status',r=>stPill(r.status)]] },
  partisipasi:      { t:'Partisipasi',         i:'fa-user-plus',           sub:'Relawan, sumbangan, kendaraan', st:1, cols:[['Waktu',r=>tm(r.createdAt)],['Warga',who],['Bentuk',r=>pill(r.jenis,'green')],['Status',r=>stPill(r.status)]] },
  relawan_contacts: { t:'Klik Kontak Relawan', i:'fa-phone',               sub:'Riwayat tombol hubungi relawan', cols:[['Waktu',r=>tm(r.createdAt)],['Pengguna',who],['Relawan',r=>esc(r.nama)],['WA',r=>esc(r.wa)],['Konteks',r=>esc(r.konteks)]] },
  users:            { t:'Pengguna',            i:'fa-users',               sub:'Akun yang login (Google/email)', cols:[['Email',r=>`<b>${esc(r.email)}</b>`],['Nama',r=>esc(r.name)],['Terakhir Aktif',r=>tm(r.lastSeen)]] }
};
const D = {}; Object.keys(COL).forEach(k => D[k] = []);
let cur = 'dashboard', F = { q:'', s:'' };
let map = null, markerLayer = null, charts = {};

/* ═══════════════════════════════════════════════════════════════
   SIMULASI DATA FIKTIF
   ═══════════════════════════════════════════════════════════════ */
const SIM_INTERVAL = 15000; // laporan baru masuk tiap 15 detik

/* Titik koordinat nyata di Provinsi Banten */
const LOKASI = [
  { nama:'Kota Serang',             lat:-6.1200, lng:106.1503 },
  { nama:'Kota Cilegon',            lat:-6.0027, lng:106.0114 },
  { nama:'Pandeglang',              lat:-6.3086, lng:106.1059 },
  { nama:'Rangkasbitung, Lebak',    lat:-6.3595, lng:106.2494 },
  { nama:'Kab. Tangerang',          lat:-6.1783, lng:106.6319 },
  { nama:'Tangerang Selatan',       lat:-6.2884, lng:106.7179 },
  { nama:'Anyer',                   lat:-6.0667, lng:105.8833 },
  { nama:'Carita',                  lat:-6.3000, lng:105.8500 },
  { nama:'Labuan',                  lat:-6.3833, lng:105.8333 },
  { nama:'Malingping, Lebak',       lat:-6.7667, lng:106.0167 },
  { nama:'Merak',                   lat:-5.9333, lng:106.0000 },
  { nama:'Balaraja',                lat:-6.1833, lng:106.4500 },
  { nama:'Serpong',                 lat:-6.3167, lng:106.6667 },
  { nama:'Ujung Kulon',             lat:-6.7500, lng:105.3333 },
  { nama:'Kragilan, Serang',        lat:-6.1833, lng:106.3000 },
  { nama:'Cikande, Serang',         lat:-6.2000, lng:106.3667 },
  { nama:'Cibaliung, Pandeglang',   lat:-6.7167, lng:105.7167 },
  { nama:'Kresek, Tangerang',       lat:-6.1333, lng:106.3833 }
];

const JENIS = ['Banjir','Tanah Longsor','Gempa Bumi','Kebakaran','Angin Puting Beliung','Cuaca Ekstrem','Pohon Tumbang','Orang Hilang','Evakuasi Warga','Kerusakan Bangunan','Kecelakaan Air'];

const KRON = {
  'Banjir':'Air sungai meluap setelah hujan deras sejak sore. Ketinggian air ±80 cm dan mulai masuk ke rumah warga.',
  'Tanah Longsor':'Tebing setinggi ±6 meter longsor menutup akses jalan desa. Warga sementara mengungsi ke balai desa.',
  'Gempa Bumi':'Getaran kuat dirasakan ±10 detik. Beberapa warga panik keluar rumah. Belum ada laporan korban jiwa.',
  'Kebakaran':'Api muncul dari bagian dapur dan merembet ke dua rumah petak. Warga berusaha memadamkan dengan alat seadanya.',
  'Angin Puting Beliung':'Angin kencang merobohkan beberapa pohon dan atap rumah warga. Akses jalan tertutup material.',
  'Cuaca Ekstrem':'Hujan lebat disertai angin membuat sejumlah titik tergenang dan listrik padam sejak petang.',
  'Pohon Tumbang':'Pohon besar tumbang menutup badan jalan. Arus lalu lintas tersendat, butuh bantuan alat berat.',
  'Orang Hilang':'Warga melaporkan anggota keluarga tidak kembali sejak pergi ke area sungai kemarin sore.',
  'Evakuasi Warga':'Warga di bantaran sungai meminta evakuasi karena debit air terus naik sejak malam.',
  'Kerusakan Bangunan':'Dinding rumah retak dan sebagian atap ambruk. Keluarga butuh tempat penampungan sementara.',
  'Kecelakaan Air':'Perahu nelayan terbalik dihantam gelombang tinggi. Dua orang selamat, satu masih dicari.'
};

const NAMA = ['Ahmad Fauzi','Siti Aminah','Budi Santoso','Rina Marlina','Dedi Kurniawan','Nur Aisyah','Agus Salim','Yanti Suryani','Hendra Gunawan','Wulan Sari','Rizki Ramadhan','Fitri Handayani','Joko Prasetyo','Maya Lestari','Ujang Solihin','Dewi Anggraeni','Teguh Wibowo','Lilis Suryani','Bayu Nugraha','Euis Komariah'];

const LAYANAN = ['Ambulans','Obat-obatan','Bantuan Makanan','Evakuasi','Konseling','Air Bersih','Selimut & Pakaian','Penerangan'];
const PARTISIPASI = ['Relawan Lapangan','Donasi Tunai','Donasi Logistik','Kendaraan','Alat Berat','Tenaga Medis'];

let seq = 0;
const rnd = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const emailOf = n => n.toLowerCase().replace(/[^a-z]+/g, '.') + rint(10, 99) + '@gmail.com';

function makeReport(minsAgo, status) {
  const lok = rnd(LOKASI), jenis = rnd(JENIS), nama = rnd(NAMA);
  const t = new Date(Date.now() - minsAgo * 60000);
  const st = status || (minsAgo < 90 ? 'baru' : minsAgo < 720 ? rnd(['baru', 'diproses']) : rnd(['diproses', 'selesai', 'selesai']));
  return {
    id: 'rep' + (++seq),
    createdAt: t,
    updatedAt: st === 'baru' ? null : new Date(t.getTime() + rint(8, 90) * 60000),
    email: emailOf(nama), name: nama,
    jenis,
    kronologi: KRON[jenis] || 'Laporan warga.',
    lokasi: lok.nama,
    /* koordinat + sedikit sebaran agar penanda tidak menumpuk */
    lat: +(lok.lat + (Math.random() - .5) * 0.028).toFixed(5),
    lng: +(lok.lng + (Math.random() - .5) * 0.028).toFixed(5),
    audio: Math.random() < 0.35,
    status: st,
    device: { mobile: Math.random() < 0.8, ua: 'Simulasi Admin' }
  };
}
function makeLayanan(minsAgo) {
  const nama = rnd(NAMA), t = new Date(Date.now() - minsAgo * 60000);
  return { id:'lyn' + (++seq), createdAt:t, email:emailOf(nama), name:nama, jenis:rnd(LAYANAN), waTarget:'08' + rint(1000000000, 9999999999), status: minsAgo < 120 ? 'baru' : rnd(['baru','diproses','selesai']) };
}
function makePartisipasi(minsAgo) {
  const nama = rnd(NAMA), t = new Date(Date.now() - minsAgo * 60000);
  return { id:'prt' + (++seq), createdAt:t, email:emailOf(nama), name:nama, jenis:rnd(PARTISIPASI), status: rnd(['baru','diproses','selesai']) };
}
function makeKontak(minsAgo) {
  const nama = rnd(NAMA), t = new Date(Date.now() - minsAgo * 60000);
  return { id:'ktk' + (++seq), createdAt:t, email:emailOf(rnd(NAMA)), nama, wa:'08' + rint(1000000000, 9999999999), konteks:rnd(['Laporan Banjir','Laporan Longsor','Butuh Ambulans','Evakuasi','Info Posko']) };
}
function makeUser(minsAgo) {
  const nama = rnd(NAMA);
  return { id:'usr' + (++seq), email:emailOf(nama), name:nama, lastSeen:new Date(Date.now() - (minsAgo || 0) * 60000) };
}

function seed() {
  seq = 0;
  D.reports = Array.from({ length: 16 }, () => makeReport(rint(3, 7 * 24 * 60))).sort((a, b) => b.createdAt - a.createdAt);
  D.layanan_requests = Array.from({ length: 8 }, () => makeLayanan(rint(10, 5 * 24 * 60))).sort((a, b) => b.createdAt - a.createdAt);
  D.partisipasi = Array.from({ length: 10 }, () => makePartisipasi(rint(10, 5 * 24 * 60))).sort((a, b) => b.createdAt - a.createdAt);
  D.relawan_contacts = Array.from({ length: 6 }, () => makeKontak(rint(10, 3 * 24 * 60))).sort((a, b) => b.createdAt - a.createdAt);
  D.users = Array.from({ length: 12 }, () => makeUser(rint(0, 4 * 24 * 60))).sort((a, b) => b.lastSeen - a.lastSeen);
}

/* laporan baru masuk secara berkala */
function simTick() {
  const r = makeReport(0, 'baru');
  r.createdAt = new Date();
  D.reports.unshift(r);
  if (Math.random() < 0.4) D.layanan_requests.unshift(makeLayanan(0));
  if (Math.random() < 0.3) D.partisipasi.unshift(makePartisipasi(0));
  if (Math.random() < 0.25) D.users.unshift(makeUser(0));
  badges(); render();
  toast('🚨 Laporan baru masuk: ' + r.jenis + ' — ' + r.lokasi, 6000);
}

/* ═══ NAVIGASI ═══ */
function buildNav() {
  $('nav').innerHTML = `<button class="nl on" data-s="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>` +
    Object.entries(COL).map(([k, c]) => `<button class="nl" data-s="${k}"><i class="fas ${c.i}"></i> ${c.t}<b class="hide" id="bd-${k}">0</b></button>`).join('');
}
function badges() {
  const n = D.reports.filter(r => !r.status || r.status === 'baru').length, b = $('bd-reports');
  if (b) { b.textContent = n; b.classList.toggle('hide', !n); }
}
$('nav').onclick = e => { const b = e.target.closest('[data-s]'); if (b) show(b.dataset.s); };
$('ham').onclick = () => $('side').classList.toggle('on');

function show(s) {
  cur = s; F = { q:'', s:'' }; $('side').classList.remove('on');
  document.querySelectorAll('.nl[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  if (s === 'dashboard') { dashBuild(); dashRefresh(); return; }
  const c = COL[s];
  $('title').textContent = c.t; $('sub').textContent = c.sub;
  $('view').innerHTML = `<div class="panel"><div class="bar"><input id="fq" type="search" placeholder="🔍 Cari…">${c.st ? `<select id="fs"><option value="">Semua status</option><option value="baru">Baru</option><option value="diproses">Diproses</option><option value="selesai">Selesai</option></select>` : ''}<small id="cnt"></small></div>
  <div class="tw"><table><thead><tr>${c.cols.map(k => `<th>${k[0]}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div></div>`;
  $('fq').oninput = e => { F.q = e.target.value.toLowerCase(); fill(); };
  if ($('fs')) $('fs').onchange = e => { F.s = e.target.value; fill(); };
  fill();
}

function rows() {
  let a = D[cur];
  if (F.q) a = a.filter(r => JSON.stringify(r).toLowerCase().includes(F.q));
  if (F.s) a = a.filter(r => (r.status || 'baru') === F.s);
  return a;
}
function fill() {
  if (!COL[cur] || !$('tb')) return;
  const c = COL[cur], a = rows();
  $('cnt').textContent = a.length + ' data';
  $('tb').innerHTML = a.length
    ? a.map(r => `<tr data-id="${esc(r.id)}">${c.cols.map(k => `<td>${k[1](r)}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="empty" colspan="9"><i class="fas fa-inbox" style="font-size:2rem;opacity:.4"></i><br>Tidak ada data</td></tr>`;
}

/* klik baris → detail */
$('view').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr && !e.target.closest('a')) detail(tr.dataset.id, tr.dataset.coll || cur);
});

function render() {
  if (cur === 'dashboard') dashRefresh();
  else fill();
}

/* ═══════════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════════ */
function dashBuild() {
  $('title').textContent = 'Dashboard';
  $('sub').textContent = 'Ringkasan aktivitas aplikasi BANDUL · Provinsi Banten';
  $('view').innerHTML = `
  <div class="stats" id="stats"></div>
  <div class="panel">
    <div class="ph">
      <h3><i class="fas fa-map-location-dot" style="color:var(--red)"></i> Peta Sebaran Laporan — Provinsi Banten</h3>
      <span class="pill red" id="mapCount">0 titik</span>
      <button class="btn b4" id="recenter"><i class="fas fa-crosshairs"></i> Fokus Banten</button>
    </div>
    <div class="pb" style="padding:10px"><div id="map"></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="ph"><h3>📈 Tren Laporan 7 Hari</h3></div><div class="pb"><div class="cw"><canvas id="c1"></canvas></div></div></div>
    <div class="panel"><div class="ph"><h3>🥧 Jenis Kejadian</h3></div><div class="pb"><div class="cw"><canvas id="c2"></canvas></div></div></div>
  </div>
  <div class="panel">
    <div class="ph"><h3>⚡ Laporan Terbaru</h3><button class="btn b4" id="allrep">Lihat semua →</button></div>
    <div class="tw"><table><thead><tr><th>Waktu</th><th>Pelapor</th><th>Jenis</th><th>Lokasi</th><th>Status</th></tr></thead><tbody id="rc"></tbody></table></div>
  </div>`;
  $('recenter').onclick = () => { if (map) map.setView([-6.35, 106.15], 9); };
  $('allrep').onclick = () => show('reports');
  initMap();
}

/* ── PETA ── */
const BANTEN_CENTER = [-6.35, 106.15];

function initMap() {
  if (map) { try { map.remove(); } catch (e) {} map = null; }
  const el = $('map'); if (!el) return;
  map = L.map('map', { scrollWheelZoom: true, zoomControl: true }).setView(BANTEN_CENTER, 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
  refreshMarkers();
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 250);
}

function dotIcon(isNew) {
  return L.divIcon({
    className: '',
    html: `<span class="map-dot">${isNew ? '<span class="ring"></span>' : ''}<span class="core"></span></span>`,
    iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -11]
  });
}

function popupHtml(r) {
  return `<div style="min-width:200px">
    <div style="font-weight:700;font-size:.88rem;margin-bottom:2px">${esc(r.jenis)}</div>
    <div style="color:#3D5166">${esc(r.lokasi || 'Banten')}</div>
    <div style="color:#7A94AB;font-size:.72rem;margin:3px 0 6px">${tm(r.createdAt)} · ${ago(r.createdAt)}</div>
    <div style="margin-bottom:8px">${stPill(r.status)}</div>
    <a href="#" class="pop-link" data-id="${esc(r.id)}" style="color:#0B3D91;font-weight:700;font-size:.78rem">Lihat detail →</a>
  </div>`;
}

function refreshMarkers() {
  if (!map || !markerLayer) return;
  markerLayer.clearLayers();
  const list = D.reports.filter(r => r.lat && r.lng);
  list.forEach(r => {
    const isNew = !r.status || r.status === 'baru';
    const m = L.marker([r.lat, r.lng], { icon: dotIcon(isNew), title: r.jenis }).addTo(markerLayer);
    m.bindPopup(popupHtml(r), { maxWidth: 260 });
  });
  const c = $('mapCount'); if (c) c.textContent = list.length + ' titik';
}

/* klik "Lihat detail" di popup peta */
document.addEventListener('click', e => {
  const a = e.target.closest('.pop-link');
  if (a) { e.preventDefault(); detail(a.dataset.id, 'reports'); if (map) map.closePopup(); }
});

/* ── refresh dashboard ── */
function dashRefresh() {
  if (cur !== 'dashboard' || !$('stats')) return;
  updateStats(); updateRecent(); refreshMarkers(); updateCharts();
}

function updateStats() {
  const today = ts => { const d = dt(ts), n = new Date(); return d && d.toDateString() === n.toDateString(); };
  const r = D.reports, baru = r.filter(x => !x.status || x.status === 'baru').length;
  const card = (ic, col, bg, n, lbl, sm) => `<div class="sc"><i class="fas ${ic}" style="background:${bg};color:${col}"></i><h3>${n}</h3><p>${lbl}</p><small>${sm}</small></div>`;
  $('stats').innerHTML =
    card('fa-file-medical','#D62828','#FFF0F0', r.length, 'Total Laporan', r.filter(x => today(x.createdAt)).length + ' hari ini · ' + baru + ' baru') +
    card('fa-hands-holding-heart','#C45F00','#FFF6EE', D.layanan_requests.length, 'Permintaan Layanan', D.layanan_requests.filter(x => today(x.createdAt)).length + ' hari ini') +
    card('fa-user-plus','#1A9E3F','#EDFBF2', D.partisipasi.length, 'Partisipasi Warga', D.partisipasi.filter(x => today(x.createdAt)).length + ' hari ini') +
    card('fa-users','#0B3D91','#EEF4FF', D.users.length, 'Pengguna Login', D.users.filter(x => today(x.lastSeen)).length + ' aktif hari ini');
}

function updateRecent() {
  const tb = $('rc'); if (!tb) return;
  const recent = D.reports.slice(0, 8);
  tb.innerHTML = recent.length
    ? recent.map(x => `<tr data-id="${esc(x.id)}" data-coll="reports"><td>${tm(x.createdAt)}</td><td>${who(x)}</td><td>${pill(x.jenis)}</td><td>${mp(x)}</td><td>${stPill(x.status)}</td></tr>`).join('')
    : '<tr><td class="empty" colspan="5">Belum ada laporan</td></tr>';
}

function updateCharts() {
  if (typeof Chart === 'undefined' || !$('c1')) return;
  Object.values(charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  charts = {};
  const r = D.reports;

  const lab = [], cnt = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    lab.push(d.toLocaleDateString('id-ID', { day:'numeric', month:'short' }));
    cnt.push(r.filter(x => { const t = dt(x.createdAt); return t && t.toDateString() === d.toDateString(); }).length);
  }
  charts.a = new Chart($('c1'), {
    type:'line',
    data:{ labels:lab, datasets:[{ data:cnt, borderColor:'#0B3D91', backgroundColor:'rgba(11,61,145,.12)', fill:true, tension:.4, borderWidth:3, pointBackgroundColor:'#D62828', pointRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });

  const jm = {}; r.forEach(x => { const j = x.jenis || 'Lainnya'; jm[j] = (jm[j] || 0) + 1; });
  const keys = Object.keys(jm);
  charts.b = new Chart($('c2'), {
    type:'doughnut',
    data:{ labels: keys.length ? keys : ['Belum ada'], datasets:[{ data: keys.length ? Object.values(jm) : [1], backgroundColor:['#D62828','#1557C0','#00838F','#7B5E2A','#F4A261','#7C3AED','#2DC653','#7A94AB','#E76F51','#264653','#E9C46A'], borderColor:'#fff', borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'right', labels:{ boxWidth:12, font:{ size:11 } } } } }
  });
}

/* ═══ DETAIL & AKSI ═══ */
const LBL = { createdAt:'Diterima', updatedAt:'Diperbarui', lastSeen:'Terakhir aktif', jenis:'Jenis', kronologi:'Kronologi', pesan:'Pesan', waTarget:'WA tujuan', tanggal:'Waktu kejadian', audio:'Ada rekaman', nama:'Nama', wa:'WA', konteks:'Konteks', email:'Email', name:'Nama', status:'Status', device:'Perangkat', uid:'UID', lokasi:'Lokasi' };

function detail(id, coll) {
  const r = (D[coll] || []).find(x => x.id === id); if (!r) return;
  const c = COL[coll];
  const val = (k, v) => {
    if (/At$|lastSeen|firstSeen/.test(k)) return tm(v);
    if (k === 'device' && v) return esc((v.mobile ? 'Mobile' : 'Desktop') + ' · ' + (v.ua || ''));
    if (k === 'status') return stPill(v);
    if (k === 'audio') return v ? 'Ya (dilampirkan via WhatsApp)' : 'Tidak';
    return esc(v);
  };
  $('md').innerHTML = `<div class="mh"><h3>${esc(c.t)}</h3><button class="btn b4" id="mx" aria-label="Tutup"><i class="fas fa-times"></i></button></div>` +
    Object.entries(r).filter(([k]) => !['id', 'lat', 'lng'].includes(k)).map(([k, v]) => `<div class="dr"><small>${esc(LBL[k] || k)}</small><span>${val(k, v)}</span></div>`).join('') +
    (r.lat ? `<div class="dr"><small>Koordinat GPS</small><span><a href="https://www.google.com/maps?q=${esc(r.lat)},${esc(r.lng)}" target="_blank" rel="noopener" style="color:var(--blue)">${esc(r.lat)}, ${esc(r.lng)} → Buka peta</a></span></div>` : '') +
    `<div class="mf">${c.st ? `<button class="btn b3" data-a="diproses"><i class="fas fa-spinner"></i> Diproses</button><button class="btn b2" data-a="selesai"><i class="fas fa-check"></i> Selesai</button>` : ''}${r.email ? `<a class="btn b1" href="mailto:${esc(r.email)}"><i class="fas fa-envelope"></i> Email</a>` : ''}<button class="btn b5" data-a="del"><i class="fas fa-trash"></i> Hapus</button></div>`;
  $('ov').classList.add('on');
  $('mx').onclick = closeM;
  $('md').querySelector('.mf').onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'del') {
      if (!confirm('Hapus data ini permanen?')) return;
      const arr = D[coll], i = arr.findIndex(x => x.id === id);
      if (i > -1) arr.splice(i, 1);
      toast('🗑️ Dihapus');
    } else {
      const t = (D[coll] || []).find(x => x.id === id);
      if (t) { t.status = b.dataset.a; t.updatedAt = new Date(); }
      toast('✅ Status: ' + b.dataset.a);
    }
    closeM(); badges(); render();
  };
}
const closeM = () => $('ov').classList.remove('on');
$('ov').onclick = e => { if (e.target.id === 'ov') closeM(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

/* ═══ EXPORT CSV (aman dari CSV-injection) ═══ */
$('exp').onclick = () => {
  const name = cur === 'dashboard' ? 'reports' : cur, a = D[name] || [];
  if (!a.length) return toast('⚠️ Tidak ada data');
  const keys = [...new Set(a.flatMap(o => Object.keys(o)))];
  const cell = v => {
    if (v && v.toDate) v = v.toDate().toISOString();
    else if (v && typeof v === 'object') v = JSON.stringify(v);
    v = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  };
  const csv = [keys.join(','), ...a.map(r => keys.map(k => cell(r[k])).join(','))].join('\n');
  const l = document.createElement('a');
  l.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' }));
  l.download = 'bandul_' + name + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  l.click(); toast('📥 CSV terunduh');
};

/* ═══ RESET SIMULASI ═══ */
$('reset').onclick = () => {
  if (!confirm('Reset seluruh data simulasi?')) return;
  Object.keys(D).forEach(k => D[k] = []);
  seed(); badges(); show('dashboard'); toast('🔄 Data simulasi direset');
};

/* ═══ START ═══ */
seed();
buildNav();
show('dashboard');
badges();
setInterval(simTick, SIM_INTERVAL);
</script>
