<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANDUL Admin Panel</title>
<link rel="icon" type="image/png" href="https://fesbukbantennews.com/wp-content/uploads/2025/07/cropped-logo-fbn-2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue:#0B3D91;--blue-mid:#1557C0;--blue-light:#EEF4FF;
  --red:#D62828;--red-light:#FFF0F0;--green:#2DC653;--green-dark:#1A9E3F;--green-light:#EDFBF2;
  --amber:#F4A261;--amber-light:#FFF6EE;--purple:#7C3AED;--purple-light:#F5F0FF;
  --ink:#0D1B2A;--ink-mid:#3D5166;--ink-soft:#7A94AB;
  --surface:#F4F7FB;--white:#FFF;--border:rgba(11,61,145,.10);
  --shadow-sm:0 2px 8px rgba(11,61,145,.08);--shadow-md:0 8px 28px rgba(11,61,145,.12);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);min-height:100dvh;line-height:1.5}
h1,h2,h3,h4,button{font-family:'Poppins',sans-serif}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--blue-mid);border-radius:6px}

/* LOGIN */
/* #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;background:linear-gradient(160deg,#0B3D91 0%,#07285F 60%,#041B44 100%)}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-logo{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid var(--blue-light);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-box h1{font-size:1.5rem;font-weight:800;text-align:center;color:var(--blue)}
.login-box .subtitle{text-align:center;font-size:.72rem;color:var(--ink-soft);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:.9rem;background:var(--surface);outline:none;margin-bottom:10px;font-family:'Inter',sans-serif}
.input:focus{border-color:var(--blue);background:#fff}
.btn{width:100%;border-radius:50px;padding:13px 18px;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Poppins',sans-serif;transition:.15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink-mid)}
.btn-sm{padding:8px 14px;font-size:.75rem;width:auto}
.error-msg{background:var(--red-light);color:var(--red);font-size:.78rem;font-weight:600;padding:10px 12px;border-radius:10px;margin-top:12px;display:none}
.error-msg.show{display:block}  */

/* DASHBOARD */
.app-header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(11,61,145,.25);position:sticky;top:0;z-index:100}
.app-header .logo{width:38px;height:38px;border-radius:50%;background:#fff;overflow:hidden;flex-shrink:0}
.app-header .logo img{width:100%;height:100%;object-fit:cover}
.app-header .title{flex:1}
.app-header .title h1{font-size:.95rem;font-weight:800}
.app-header .title p{font-size:.68rem;opacity:.8}
.app-header .user-info{font-size:.72rem;text-align:right;margin-right:8px;opacity:.9}
.app-header button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.container{max-width:1280px;margin:0 auto;padding:20px 16px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:16px;padding:18px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.stat-info strong{display:block;font-size:1.5rem;font-weight:900;color:var(--ink);line-height:1;font-family:'Poppins',sans-serif}
.stat-info span{font-size:.7rem;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.panel{background:#fff;border-radius:16px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden}
.panel-header{padding:16px 18px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-header h2{font-size:1rem;font-weight:800;flex:1}
.panel-header .filters{display:flex;gap:8px;flex-wrap:wrap}
.panel-header select,.panel-header input{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;background:var(--surface);outline:none;font-family:'Inter',sans-serif}
.panel-body{padding:0}

.chart-bars{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px;font-size:.78rem}
.bar-label{min-width:120px;font-weight:600;color:var(--ink-mid)}
.bar-track{flex:1;height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--blue);transition:width .5s ease}
.bar-count{min-width:34px;text-align:right;font-weight:700;color:var(--ink);font-size:.78rem}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--surface);text-align:left;padding:12px 14px;font-weight:700;color:var(--ink-mid);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--border);color:var(--ink-mid);vertical-align:top}
tr:hover td{background:var(--blue-light)}

.badge{font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:50px;white-space:nowrap;display:inline-block}
.badge-baru{background:var(--amber-light);color:#C45F00}
.badge-diproses{background:var(--blue-light);color:var(--blue)}
.badge-selesai{background:var(--green-light);color:var(--green-dark)}
.badge-ditolak{background:var(--red-light);color:var(--red)}
.badge-admin{background:var(--purple-light);color:var(--purple)}

.btn-action{padding:5px 10px;border-radius:8px;font-size:.7rem;font-weight:600;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:4px;margin-right:4px}
.btn-view{background:var(--blue-light);color:var(--blue)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
.modal h3{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.modal .hint{font-size:.78rem;color:var(--ink-soft);margin-bottom:16px}
.detail-row{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;font-size:.83rem}
.detail-row:last-child{border-bottom:none}
.detail-row strong{min-width:90px;color:var(--ink-soft);font-weight:600}
.detail-row span{color:var(--ink-mid);flex:1;word-break:break-word}
.form-label{font-size:.75rem;font-weight:600;color:var(--ink-mid);display:block;margin:14px 0 6px}
select.input,textarea.input{resize:none}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty i{font-size:2.5rem;color:var(--blue-light);margin-bottom:10px}
.loader{padding:40px;text-align:center;color:var(--ink-soft)}
.loader i{font-size:1.5rem}

.toast{position:fixed;top:20px;right:20px;background:var(--ink);color:#fff;font-size:.8rem;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(-10px);transition:.3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab-btn{padding:10px 18px;font-size:.82rem;font-weight:700;font-family:'Poppins',sans-serif;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-panel{display:none}
.tab-panel.active{display:block}
@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stat-icon{width:42px;height:42px;font-size:1.1rem}
  .stat-info strong{font-size:1.25rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt="Logo"></div>
    <h1>BANDUL Admin</h1>
    <div class="subtitle">Panel Monitoring &amp; Kontrol</div>
    <input class="input" type="email" id="inpEmail" placeholder="Email admin" autocomplete="email">
    <input class="input" type="password" id="inpPassword" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-blue" id="btnLogin"><i class="fas fa-sign-in-alt"></i> Masuk</button>
    <div id="loginError" class="error-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="appScreen" class="hidden">
  <header class="app-header">
    <div class="logo"><img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt="Logo"></div>
    <div class="title">
      <h1>BANDUL Admin Panel</h1>
      <p>Monitoring &amp; Laporan Banten Peduli</p>
    </div>
    <div class="user-info" id="userInfo">-</div>
    <button id="btnLogout" title="Keluar"><i class="fas fa-sign-out-alt"></i></button>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
      <button class="tab-btn" data-tab="reports"><i class="fas fa-file-alt"></i> Laporan</button>
      <button class="tab-btn" data-tab="users"><i class="fas fa-users"></i> Pengguna</button>
    </div>

    <!-- TAB: DASHBOARD -->
    <div id="tab-dashboard" class="tab-panel active">
      <div class="stats-grid" id="statsGrid"></div>

      <div class="panel">
        <div class="panel-header"><h2><i class="fas fa-chart-bar" style="color:var(--blue)"></i> Laporan per Jenis</h2></div>
        <div class="chart-bars" id="chartJenis"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2><i class="fas fa-clock" style="color:var(--amber)"></i> Laporan per Status</h2></div>
        <div class="chart-bars" id="chartStatus"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2><i class="fas fa-calendar" style="color:var(--green-dark)"></i> Tren 7 Hari Terakhir</h2></div>
        <div class="chart-bars" id="chartTrend"></div>
      </div>
    </div>

    <!-- TAB: REPORTS -->
    <div id="tab-reports" class="tab-panel">
      <div class="panel">
        <div class="panel-header">
          <h2><i class="fas fa-list"></i> Daftar Laporan</h2>
          <div class="filters">
            <select id="filterStatus">
              <option value="">Semua Status</option>
              <option value="baru">Baru</option>
              <option value="diproses">Diproses</option>
              <option value="selesai">Selesai</option>
              <option value="ditolak">Ditolak</option>
            </select>
            <select id="filterJenis">
              <option value="">Semua Jenis</option>
              <option>Gempa Bumi</option><option>Banjir</option><option>Tsunami</option>
              <option>Tanah Longsor</option><option>Kebakaran</option>
              <option>Perlindungan Anak</option><option>Medis Darurat</option><option>Lainnya</option>
            </select>
            <input type="text" id="filterSearch" placeholder="🔍 Cari email / kronologi...">
            <button class="btn btn-outline btn-sm" id="btnExport"><i class="fas fa-download"></i> CSV</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="table-wrap" id="reportsTableWrap">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: USERS -->
    <div id="tab-users" class="tab-panel">
      <div class="panel">
        <div class="panel-header"><h2><i class="fas fa-users"></i> Daftar Pengguna</h2></div>
        <div class="panel-body">
          <div class="table-wrap" id="usersTableWrap">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="overlay">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="dTitle">Detail Laporan</h3>
    <p class="hint" id="dSubtitle"></p>
    <div id="dBody"></div>

    <label class="form-label">Status Laporan</label>
    <select class="input" id="dStatus">
      <option value="baru">Baru</option>
      <option value="diproses">Diproses</option>
      <option value="selesai">Selesai</option>
      <option value="ditolak">Ditolak</option>
    </select>

    <label class="form-label">Catatan / Balasan untuk Pelapor</label>
    <textarea class="input" id="dNote" rows="3" placeholder="Contoh: Tim relawan sudah diberangkatkan ke lokasi..."></textarea>

    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-outline" id="dCancel"><i class="fas fa-times"></i> Tutup</button>
      <button class="btn btn-green" id="dSave"><i class="fas fa-save"></i> Simpan Perubahan</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
/* ══════════════════════════════════════════════════════
   🔧 KONFIGURASI FIREBASE — HARUS SAMA DENGAN index.html
══════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI.firebaseapp.com",
  projectId: "ISI",
  storageBucket: "ISI.appspot.com",
  messagingSenderId: "ISI",
  appId: "ISI"
};
/* ══════════════════════════════════════════════════════ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, updateDoc,
  query, orderBy, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const showToast = (msg, ms=2600) => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), ms);
};
const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtDate = ts => {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
};
const dayKey = ts => {
  if (!ts) return null;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toISOString().slice(0,10);
};

let state = { user:null, reports:[], users:[], filtered:[] };

/* ─── LOGIN ─── */
$('btnLogin').addEventListener('click', async () => {
  const email = $('inpEmail').value.trim();
  const pass  = $('inpPassword').value;
  if (!email || !pass) return showError('Email dan password wajib diisi.');
  try {
    $('btnLogin').disabled = true;
    $('btnLogin').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';
    hideError();
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    showError('Login gagal: email atau password salah.');
    $('btnLogin').disabled = false;
    $('btnLogin').innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
  }
});

function showError(m){ const e=$('loginError'); e.textContent=m; e.classList.add('show'); }
function hideError(){ $('loginError').classList.remove('show'); }

/* ─── AUTH ─── */
onAuthStateChanged(auth, async user => {
  if (!user) {
    $('appScreen').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    $('btnLogin').disabled = false;
    $('btnLogin').innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
    return;
  }
  // Cek role admin
  const userRef = doc(db, 'users', user.uid);
  const userSnap = await getDoc(userRef);
  const role = userSnap.exists() ? userSnap.data().role : 'user';
  if (role !== 'admin') {
    await signOut(auth);
    showError('Akun ini bukan admin. Hubungi administrator untuk akses.');
    return;
  }
  state.user = user;
  $('loginScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  $('userInfo').textContent = user.email;
  loadAll();
});

$('btnLogout').addEventListener('click', () => signOut(auth));

/* ─── TABS ─── */
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('tab-' + b.dataset.tab).classList.add('active');
  });
});

/* ─── LOAD DATA ─── */
async function loadAll() {
  try {
    // Load reports
    const rSnap = await getDocs(query(collection(db, 'reports'), orderBy('createdAt','desc'), limit(500)));
    state.reports = rSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    // Load users
    const uSnap = await getDocs(collection(db, 'users'));
    state.users = uSnap.docs.map(d => ({ id:d.id, ...d.data() }));

    renderStats();
    renderCharts();
    renderReportsTable();
    renderUsersTable();
  } catch (e) {
    console.error(e);
    showToast('❌ Gagal memuat data: ' + e.message, 3500);
  }
}

/* ─── STATS ─── */
function renderStats() {
  const total = state.reports.length;
  const baru  = state.reports.filter(r => r.status === 'baru').length;
  const proses= state.reports.filter(r => r.status === 'diproses').length;
  const selesai = state.reports.filter(r => r.status === 'selesai').length;
  const userCount = state.users.length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = state.reports.filter(r => dayKey(r.createdAt) === today).length;

  $('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-icon" style="background:var(--blue-light);color:var(--blue)"><i class="fas fa-file-alt"></i></div><div class="stat-info"><strong>${total}</strong><span>Total Laporan</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--amber-light);color:#C45F00"><i class="fas fa-circle-exclamation"></i></div><div class="stat-info"><strong>${baru}</strong><span>Baru</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--blue-light);color:var(--blue-mid)"><i class="fas fa-spinner"></i></div><div class="stat-info"><strong>${proses}</strong><span>Diproses</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--green-light);color:var(--green-dark)"><i class="fas fa-check-circle"></i></div><div class="stat-info"><strong>${selesai}</strong><span>Selesai</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--purple-light);color:var(--purple)"><i class="fas fa-users"></i></div><div class="stat-info"><strong>${userCount}</strong><span>Pengguna</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--red-light);color:var(--red)"><i class="fas fa-calendar-day"></i></div><div class="stat-info"><strong>${todayCount}</strong><span>Hari Ini</span></div></div>
  `;
}

function barRow(label, count, total, color) {
  const pct = total ? Math.round(count/total*100) : 0;
  return `<div class="bar-row">
    <div class="bar-label">${escapeHtml(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="bar-count">${count}</div>
  </div>`;
}

function renderCharts() {
  const total = state.reports.length || 1;

  // By Jenis
  const jenisCount = {};
  state.reports.forEach(r => { jenisCount[r.jenis] = (jenisCount[r.jenis]||0)+1; });
  const jenisSorted = Object.entries(jenisCount).sort((a,b)=>b[1]-a[1]);
  $('chartJenis').innerHTML = jenisSorted.length
    ? jenisSorted.map(([k,v]) => barRow(k, v, total, 'var(--blue)')).join('')
    : '<div class="empty"><i class="fas fa-chart-bar"></i><p>Belum ada data</p></div>';

  // By Status
  const statuses = [['baru','Baru','var(--amber)'],['diproses','Diproses','var(--blue-mid)'],['selesai','Selesai','var(--green)'],['ditolak','Ditolak','var(--red)']];
  const statusCount = {};
  state.reports.forEach(r => { statusCount[r.status] = (statusCount[r.status]||0)+1; });
  $('chartStatus').innerHTML = statuses.map(([k,l,c]) => barRow(l, statusCount[k]||0, total, c)).join('');

  // Trend 7 hari
  const days = [];
  for (let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const trend = {};
  state.reports.forEach(r => {
    const k = dayKey(r.createdAt);
    if (k) trend[k] = (trend[k]||0)+1;
  });
  const maxTrend = Math.max(1, ...days.map(d => trend[d]||0));
  $('chartTrend').innerHTML = days.map(d => {
    const label = new Date(d).toLocaleDateString('id-ID', { day:'2-digit', month:'short' });
    const cnt = trend[d] || 0;
    const pct = Math.round(cnt/maxTrend*100);
    return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--green)"></div></div>
      <div class="bar-count">${cnt}</div>
    </div>`;
  }).join('');
}

/* ─── REPORTS TABLE ─── */
function applyFilters() {
  const status = $('filterStatus').value;
  const jenis  = $('filterJenis').value;
  const q      = $('filterSearch').value.toLowerCase().trim();
  state.filtered = state.reports.filter(r => {
    if (status && r.status !== status) return false;
    if (jenis && r.jenis !== jenis) return false;
    if (q) {
      const hay = ((r.email||'')+' '+(r.kronologi||'')+' '+(r.displayName||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderReportsTable();
}

function renderReportsTable() {
  const list = state.filtered.length || $('filterStatus').value || $('filterJenis').value || $('filterSearch').value
    ? state.filtered
    : state.reports;

  if (!list.length) {
    $('reportsTableWrap').innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>Belum ada laporan.</p></div>';
    return;
  }
  const rows = list.map(r => {
    const stLabel = { 'baru':'Baru','diproses':'Diproses','selesai':'Selesai','ditolak':'Ditolak' }[r.status] || r.status;
    return `<tr>
      <td><span class="badge badge-${r.status}">${stLabel}</span></td>
      <td><strong>${escapeHtml(r.jenis)}</strong></td>
      <td>${escapeHtml(r.displayName || '-')}<br><span style="font-size:.7rem;color:var(--ink-soft)">${escapeHtml(r.email||'')}</span></td>
      <td style="max-width:280px">${escapeHtml((r.kronologi||'').slice(0,80))}${(r.kronologi||'').length>80?'...':''}</td>
      <td style="white-space:nowrap">${fmtDate(r.createdAt)}</td>
      <td><button class="btn-action btn-view" data-id="${r.id}"><i class="fas fa-eye"></i> Lihat</button></td>
    </tr>`;
  }).join('');

  $('reportsTableWrap').innerHTML = `<table>
    <thead><tr>
      <th>Status</th><th>Jenis</th><th>Pelapor</th><th>Kronologi</th><th>Waktu</th><th>Aksi</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  document.querySelectorAll('.btn-view').forEach(b => {
    b.addEventListener('click', () => openReportDetail(b.dataset.id));
  });
}

['filterStatus','filterJenis'].forEach(id => $(id).addEventListener('change', applyFilters));
$('filterSearch').addEventListener('input', applyFilters);

/* ─── REPORT DETAIL MODAL ─── */
let currentReportId = null;

function openReportDetail(id) {
  const r = state.reports.find(x => x.id === id);
  if (!r) return;
  currentReportId = id;
  $('dTitle').textContent = r.jenis;
  $('dSubtitle').textContent = `ID: ${r.id}`;
  $('dBody').innerHTML = `
    <div class="detail-row"><strong>Pelapor</strong><span>${escapeHtml(r.displayName||'-')} &lt;${escapeHtml(r.email||'')}&gt;</span></div>
    <div class="detail-row"><strong>Waktu</strong><span>${r.tanggal||'-'} · ${r.jam||'-'}</span></div>
    <div class="detail-row"><strong>Lokasi</strong><span><a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" style="color:var(--blue)">${r.lat}, ${r.lng} <i class="fas fa-external-link-alt"></i></a></span></div>
    <div class="detail-row"><strong>Kronologi</strong><span>${escapeHtml(r.kronologi||'')}</span></div>
    <div class="detail-row"><strong>Dibuat</strong><span>${fmtDate(r.createdAt)}</span></div>
    <div class="detail-row"><strong>Diperbarui</strong><span>${fmtDate(r.updatedAt)}</span></div>
  `;
  $('dStatus').value = r.status;
  $('dNote').value = r.adminNote || '';
  $('detailModal').classList.add('open');
}

$('dCancel').addEventListener('click', () => $('detailModal').classList.remove('open'));
$('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') $('detailModal').classList.remove('open'); });

$('dSave').addEventListener('click', async () => {
  if (!currentReportId) return;
  const btn = $('dSave');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
  try {
    await updateDoc(doc(db, 'reports', currentReportId), {
      status: $('dStatus').value,
      adminNote: $('dNote').value.trim(),
      handledBy: state.user.uid,
      updatedAt: serverTimestamp()
    });
    // Update local state
    const idx = state.reports.findIndex(x => x.id === currentReportId);
    if (idx >= 0) {
      state.reports[idx].status = $('dStatus').value;
      state.reports[idx].adminNote = $('dNote').value.trim();
      state.reports[idx].handledBy = state.user.uid;
      state.reports[idx].updatedAt = new Date();
    }
    renderStats(); renderCharts(); applyFilters();
    $('detailModal').classList.remove('open');
    showToast('✅ Laporan diperbarui');
  } catch (e) {
    showToast('❌ Gagal menyimpan: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Simpan Perubahan';
  }
});

/* ─── USERS TABLE ─── */
function renderUsersTable() {
  if (!state.users.length) {
    $('usersTableWrap').innerHTML = '<div class="empty"><i class="fas fa-users"></i><p>Belum ada pengguna.</p></div>';
    return;
  }
  const sorted = [...state.users].sort((a,b)=>{
    const ta = a.createdAt?.seconds||0, tb = b.createdAt?.seconds||0;
    return tb-ta;
  });
  const rows = sorted.map(u => `
    <tr>
      <td><strong>${escapeHtml(u.displayName || '-')}</strong></td>
      <td>${escapeHtml(u.email || '-')}</td>
      <td><span class="badge ${u.role==='admin'?'badge-admin':'badge-diproses'}">${u.role||'user'}</span></td>
      <td>${u.reportCount || 0}</td>
      <td>${fmtDate(u.createdAt)}</td>
      <td>${fmtDate(u.lastLogin)}</td>
    </tr>
  `).join('');
  $('usersTableWrap').innerHTML = `<table>
    <thead><tr>
      <th>Nama</th><th>Email</th><th>Role</th><th>Total Laporan</th><th>Terdaftar</th><th>Login Terakhir</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ─── EXPORT CSV ─── */
$('btnExport').addEventListener('click', () => {
  const list = state.filtered.length ? state.filtered : state.reports;
  if (!list.length) return showToast('Tidak ada data untuk diexport');
  const headers = ['ID','Status','Jenis','Pelapor','Email','Latitude','Longitude','Kronologi','Tanggal','Jam','Catatan Admin','Dibuat'];
  const rows = list.map(r => [
    r.id, r.status, r.jenis, r.displayName, r.email, r.lat, r.lng,
    (r.kronologi||'').replace(/[\r\n]+/g,' '),
    r.tanggal||'', r.jam||'', (r.adminNote||'').replace(/[\r\n]+/g,' '),
    fmtDate(r.createdAt)
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bandul_reports_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ CSV diunduh');
});
</script>
</body>
</html>
