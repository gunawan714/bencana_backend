<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071A33">
<title>BANDUL COMMAND CENTER</title>
<link rel="icon" href="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png">
<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Firebase & Charts -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg-dark: #030B17;
  --panel-bg: rgba(10, 25, 47, 0.85);
  --panel-border: rgba(30, 70, 120, 0.5);
  --blue: #1E60D1; --blue-light: #3A86FF;
  --red: #FF003C; --red-glow: rgba(255, 0, 60, 0.4);
  --green: #00E56A; --amber: #FFB703;
  --text-main: #E2E8F0; --text-muted: #8892B0;
  --glass: blur(12px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden; /* Prevent body scroll, handle scroll in panels */
  display: flex;
  flex-direction: column;
}
h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 6px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

/* --- HEADER --- */
.header {
  height: 60px;
  background: var(--panel-bg);
  backdrop-filter: var(--glass);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 1000;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-brand img { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
.header-brand h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
.header-brand span { color: var(--red); font-size: 0.7rem; padding: 2px 8px; border: 1px solid var(--red); border-radius: 4px; animation: pulseRed 2s infinite; }
.header-info { display: flex; align-items: center; gap: 20px; font-size: 0.85rem; font-weight: 600; }
.live-clock { font-family: 'Courier New', monospace; font-size: 1.1rem; color: var(--green); letter-spacing: 1px; }

/* --- MAIN LAYOUT --- */
.cc-layout {
  display: grid;
  grid-template-columns: 340px 1fr 360px;
  height: calc(100vh - 60px);
}

/* --- PANELS (LEFT & RIGHT) --- */
.side-panel {
  background: var(--panel-bg);
  backdrop-filter: var(--glass);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-panel.right { border-right: none; border-left: 1px solid var(--panel-border); }
.panel-header {
  padding: 14px 20px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--panel-border);
  font-size: 0.9rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--blue-light);
  display: flex; justify-content: space-between; align-items: center;
}
.panel-content { flex: 1; overflow-y: auto; padding: 14px; }

/* --- LEFT FEED (REPORTS) --- */
.feed-item {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
  border-left: 4px solid var(--text-muted);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.feed-item:hover { background: rgba(30, 96, 209, 0.15); border-color: var(--blue); }
.feed-item.status-baru { border-left-color: var(--red); background: rgba(255, 0, 60, 0.05); }
.feed-item.status-diproses { border-left-color: var(--amber); }
.feed-item.status-selesai { border-left-color: var(--green); opacity: 0.6; }
.feed-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; }
.feed-title { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
.feed-desc { font-size: 0.75rem; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feed-audio { display: inline-flex; margin-top: 6px; font-size: 0.7rem; color: var(--blue-light); background: rgba(58, 134, 255, 0.1); padding: 2px 8px; border-radius: 12px; }

/* --- CENTER MAP --- */
#map { width: 100%; height: 100%; background: #000; z-index: 1; }
.leaflet-popup-content-wrapper { background: var(--panel-bg); color: #fff; border: 1px solid var(--blue); border-radius: 8px; }
.leaflet-popup-tip { background: var(--panel-bg); }
.popup-custom h3 { font-size: 1rem; color: var(--red); margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
.popup-custom p { font-size: 0.8rem; margin-bottom: 4px; }
.popup-actions { display: flex; gap: 6px; margin-top: 10px; }

/* Custom Pulsing Marker for Map */
.pulse-marker { width: 24px; height: 24px; background: var(--red); border-radius: 50%; box-shadow: 0 0 0 rgba(255, 0, 60, 0.6); animation: pulseMap 1.5s infinite; border: 2px solid #fff; }
.pulse-marker.diproses { background: var(--amber); box-shadow: 0 0 0 rgba(255, 183, 3, 0.6); animation: pulseMapAmber 2s infinite; }
.pulse-marker.selesai { background: var(--green); border-radius: 50%; width: 16px; height: 16px; animation: none; border: 1px solid #fff; }

/* --- RIGHT ANALYTICS --- */
.stat-box { background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 14px; }
.stat-box h4 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.stat-box .num { font-size: 2.2rem; font-weight: 900; color: #fff; line-height: 1.2; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
.stat-box.alert .num { color: var(--red); text-shadow: 0 0 15px var(--red-glow); }
.chart-container { height: 220px; width: 100%; margin-bottom: 20px; }

/* --- BUTTONS --- */
.btn { padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; color: #fff; font-family: 'Inter', sans-serif; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.btn-blue { background: var(--blue); border: 1px solid var(--blue-light); }
.btn-amber { background: var(--amber); border: 1px solid #FFD166; color: #000; }
.btn-green { background: var(--green); border: 1px solid #06D6A0; color: #000; }

/* --- ANIMATIONS --- */
@keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes pulseMap { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }
@keyframes pulseMapAmber { 0% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(255, 183, 3, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0); } }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt="Logo BANDUL">
    <h1>BANDUL COMMAND CENTER</h1>
    <span>LIVE</span>
  </div>
  <div class="header-info">
    <div id="connStatus" style="color: var(--green);"><i class="fas fa-wifi"></i> Terhubung ke Sistem</div>
    <div class="live-clock" id="liveClock">00:00:00 WIB</div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="cc-layout">
  
  <!-- LEFT PANEL: FEED -->
  <aside class="side-panel">
    <div class="panel-header">
      <span><i class="fas fa-satellite-dish"></i> Radar Laporan</span>
      <span style="font-size: 0.7rem; background: var(--blue); padding: 2px 6px; border-radius: 10px; color:#fff;" id="feedCount">0</span>
    </div>
    <div class="panel-content" id="feedContainer">
      <!-- Feed items injected via JS -->
      <div style="text-align:center; padding:40px 20px; opacity:0.5;">
        <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; margin-bottom:10px;"></i>
        <p>Memuat transmisi data...</p>
      </div>
    </div>
  </aside>

  <!-- CENTER PANEL: MAP -->
  <main id="map"></main>

  <!-- RIGHT PANEL: ANALYTICS -->
  <aside class="side-panel right">
    <div class="panel-header">
      <span><i class="fas fa-chart-pie"></i> Analitik Real-Time</span>
    </div>
    <div class="panel-content">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="stat-box alert">
          <h4>Darurat Aktif</h4>
          <div class="num" id="statActive">0</div>
        </div>
        <div class="stat-box">
          <h4>Selesai Harian</h4>
          <div class="num" id="statResolved">0</div>
        </div>
      </div>
      
      <div class="stat-box" style="padding: 10px; text-align: left;">
        <h4 style="margin-bottom: 10px; text-align: center;">Distribusi Bencana</h4>
        <div class="chart-container"><canvas id="chartJenis"></canvas></div>
      </div>

      <div class="stat-box" style="padding: 10px; text-align: left;">
        <h4 style="margin-bottom: 10px; text-align: center;">Tren Laporan (7 Hari)</h4>
        <div class="chart-container"><canvas id="chartTrend"></canvas></div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   1. FIREBASE CONFIG — GANTI DENGAN PUNYA ANDA
═══════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain:        "bandul-app.firebaseapp.com",
  projectId:         "bandul-app",
  storageBucket:     "bandul-app.appspot.com",
  messagingSenderId: "1234567890",
  appId:             "1:1234567890:web:abcdef1234567890"
};

// Inisialisasi Firebase
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ═══════════════════════════════════════════════════════
   2. APP STATE & CLOCK
═══════════════════════════════════════════════════════ */
const state = {
  reports: [],
  markers: {}, // Menyimpan instance Leaflet marker
  charts: { jenis: null, trend: null }
};

function updateClock() {
  const now = new Date();
  document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', { hour12: false }) + ' WIB';
}
setInterval(updateClock, 1000);
updateClock();

/* ═══════════════════════════════════════════════════════
   3. MAP INITIALIZATION (LEAFLET - DARK MODE)
═══════════════════════════════════════════════════════ */
// Base map di-set ke Banten area
const map = L.map('map', { zoomControl: false }).setView([-6.3, 106.1], 9);

// Gunakan CartoDB Dark Matter untuk tampilan Command Center
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Tambahkan zoom control di kanan bawah agar tidak menutupi UI Kiri
L.control.zoom({ position: 'bottomright' }).addTo(map);

/* ═══════════════════════════════════════════════════════
   4. FIRESTORE REAL-TIME LISTENER
═══════════════════════════════════════════════════════ */
db.collection('reports')
  .orderBy('createdAt', 'desc')
  .limit(200) // Batasi visualisasi 200 data terakhir agar ringan
  .onSnapshot(snap => {
    state.reports = [];
    snap.forEach(doc => state.reports.push({ id: doc.id, ...doc.data() }));
    
    renderFeed();
    renderMapMarkers();
    renderAnalytics();
  }, err => {
    console.error("Firestore Listen Error:", err);
    document.getElementById('connStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Terputus';
    document.getElementById('connStatus').style.color = 'var(--red)';
  });

/* ═══════════════════════════════════════════════════════
   5. RENDER FEED (SIDEBAR KIRI)
═══════════════════════════════════════════════════════ */
function renderFeed() {
  const container = document.getElementById('feedContainer');
  document.getElementById('feedCount').textContent = state.reports.length;
  
  if (!state.reports.length) {
    container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Tidak ada sinyal laporan.</div>';
    return;
  }

  let html = '';
  state.reports.forEach(r => {
    const statusClass = 'status-' + (r.status || 'baru');
    const timeFmt = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : r.jam;
    const hasAudio = (r.audioNote && r.audioNote !== 'Tidak ada rekaman') ? `<div class="feed-audio"><i class="fas fa-microphone"></i> Audio Tersedia</div>` : '';
    
    html += `
      <div class="feed-item ${statusClass}" onclick="focusMap('${r.id}')">
        <div class="feed-meta">
          <span><i class="fas fa-clock"></i> ${timeFmt} WIB</span>
          <span style="text-transform:uppercase; font-weight:700;">${r.status || 'BARU'}</span>
        </div>
        <div class="feed-title"><i class="fas fa-map-marker-alt" style="color:var(--red);"></i> ${r.jenis || 'Tidak Diketahui'}</div>
        <div class="feed-desc">${escapeHTML(r.kronologi || 'Tidak ada deskripsi rinci.')}</div>
        ${hasAudio}
      </div>
    `;
  });
  container.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   6. RENDER MAP MARKERS
═══════════════════════════════════════════════════════ */
function renderMapMarkers() {
  const currentIds = new Set(state.reports.map(r => r.id));
  
  // Hapus marker yang sudah tidak ada di data terbaru
  for (let id in state.markers) {
    if (!currentIds.has(id)) {
      map.removeLayer(state.markers[id]);
      delete state.markers[id];
    }
  }

  // Tambah/Update marker
  state.reports.forEach(r => {
    if (!r.lat || !r.lng) return; // Skip jika tidak ada koordinat
    
    const status = r.status || 'baru';
    const timeFmt = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString('id-ID') : (r.tanggal + ' ' + r.jam);
    
    // Buat icon berkedip (pulsing) berdasarkan status
    const customIcon = L.divIcon({
      className: 'custom-div-icon',
      html: `<div class="pulse-marker ${status}"></div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    const popupHtml = `
      <div class="popup-custom">
        <h3>${r.jenis}</h3>
        <p><strong>Waktu:</strong> ${timeFmt}</p>
        <p><strong>Pelapor:</strong> ${escapeHTML(r.email || 'Anonim')}</p>
        <p><strong>Kronologi:</strong> ${escapeHTML(r.kronologi || 'Kosong')}</p>
        <div class="popup-actions">
          ${status !== 'selesai' ? `<button class="btn btn-amber" onclick="updateStatus('${r.id}', 'diproses')">Tugaskan</button>` : ''}
          ${status === 'diproses' ? `<button class="btn btn-green" onclick="updateStatus('${r.id}', 'selesai')">Selesai</button>` : ''}
          ${status === 'baru' ? `<button class="btn btn-blue" onclick="updateStatus('${r.id}', 'selesai')">Tandai Selesai</button>` : ''}
        </div>
      </div>
    `;

    if (state.markers[r.id]) {
      // Update marker yang sudah ada jika icon berubah (karena status)
      state.markers[r.id].setIcon(customIcon);
      state.markers[r.id].setPopupContent(popupHtml);
    } else {
      // Buat marker baru
      const marker = L.marker([parseFloat(r.lat), parseFloat(r.lng)], { icon: customIcon })
        .bindPopup(popupHtml, { minWidth: 250 });
      marker.addTo(map);
      state.markers[r.id] = marker;
    }
  });
}

function focusMap(id) {
  const marker = state.markers[id];
  if (marker) {
    const latLng = marker.getLatLng();
    map.flyTo(latLng, 15, { duration: 1.5 });
    setTimeout(() => marker.openPopup(), 1500);
  }
}

/* ═══════════════════════════════════════════════════════
   7. ANALYTICS & CHARTS
═══════════════════════════════════════════════════════ */
function renderAnalytics() {
  const today = new Date().toDateString();
  
  // Hitung Stat Kotak Atas
  let activeCount = 0;
  let resolvedToday = 0;

  const jenisMap = {};
  const trendMap = {}; // { 'YYYY-MM-DD': count }

  // Siapkan struktur trend 7 hari ke belakang
  for(let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    trendMap[d.toLocaleDateString('en-CA')] = 0; // Format YYYY-MM-DD
  }

  state.reports.forEach(r => {
    const s = r.status || 'baru';
    if (s === 'baru' || s === 'diproses') activeCount++;
    
    // Parse tanggal
    let rDateStr = '';
    if (r.createdAt?.toDate) {
      const d = r.createdAt.toDate();
      if (d.toDateString() === today && s === 'selesai') resolvedToday++;
      rDateStr = d.toLocaleDateString('en-CA');
    }

    // Chart Jenis
    const j = r.jenis || 'Lainnya';
    jenisMap[j] = (jenisMap[j] || 0) + 1;

    // Chart Trend (hanya hitung jika tanggal masuk 7 hari rentang)
    if (trendMap[rDateStr] !== undefined) {
      trendMap[rDateStr]++;
    }
  });

  document.getElementById('statActive').textContent = activeCount;
  document.getElementById('statResolved').textContent = resolvedToday;

  // -- Render Chart Jenis (Doughnut) --
  const ctxJenis = document.getElementById('chartJenis');
  const palette = ['#FF003C', '#1E60D1', '#00E56A', '#FFB703', '#8338EC', '#3A86FF', '#FB5607'];
  
  if (state.charts.jenis) state.charts.jenis.destroy();
  state.charts.jenis = new Chart(ctxJenis, {
    type: 'doughnut',
    data: {
      labels: Object.keys(jenisMap),
      datasets: [{
        data: Object.values(jenisMap),
        backgroundColor: palette,
        borderColor: '#0A192F',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#E2E8F0', font: {family: 'Inter', size: 10} } }
      }
    }
  });

  // -- Render Chart Trend (Bar) --
  const ctxTrend = document.getElementById('chartTrend');
  const tLabels = Object.keys(trendMap).map(d => {
    const [y,m,day] = d.split('-'); return `${day}/${m}`;
  });
  
  if (state.charts.trend) state.charts.trend.destroy();
  state.charts.trend = new Chart(ctxTrend, {
    type: 'bar',
    data: {
      labels: tLabels,
      datasets: [{
        label: 'Laporan',
        data: Object.values(trendMap),
        backgroundColor: 'rgba(58, 134, 255, 0.7)',
        borderColor: '#3A86FF',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { color: '#8892B0', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } },
        x: { ticks: { color: '#8892B0' }, grid: { display: false } }
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════
   8. ACTIONS (UPDATE STATUS)
═══════════════════════════════════════════════════════ */
// Terhubung dengan tombol di Popup Marker
window.updateStatus = async function(id, status) {
  try {
    await db.collection('reports').doc(id).update({
      status: status,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    map.closePopup(); // Tutup popup setelah aksi
  } catch (error) {
    console.error("Update Error:", error);
    alert("Gagal memperbarui status: " + error.message);
  }
};

// Helper: Hindari XSS pada rendering data text
function escapeHTML(str) {
  return String(str).replace(/[&<>"'`=\/]/g, function (s) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;', '`': '&#x60;', '=': '&#x3D;' }[s];
  });
}
</script>
</body>
</html>
