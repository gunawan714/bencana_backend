<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B3D91">
<title>BANDUL Admin — Monitoring</title>
<link rel="icon" href="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B3D91;--bl:#EEF4FF;--red:#D62828;--rl:#FFF0F0;--green:#2DC653;--gd:#1A9E3F;--gl:#EDFBF2;--amber:#F4A261;--al:#FFF6EE;--ink:#0D1B2A;--mid:#3D5166;--soft:#7A94AB;--bg:#F4F7FB;--bd:rgba(11,61,145,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3,button,th{font-family:Poppins,sans-serif}
button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0B3D91,#041B44)}
.lbox{background:#fff;border-radius:28px;padding:28px 24px;width:100%;max-width:380px;text-align:center}
.lbox img{width:70px;height:70px;border-radius:50%;margin-bottom:8px}.lbox h1{font-size:1.2rem}.lbox p{font-size:.78rem;color:var(--soft);margin-bottom:16px}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:.85rem;background:#fff;outline:0;margin-bottom:10px}
input:focus,select:focus{border-color:var(--blue)}
#lerr{color:var(--red);font-size:.78rem;min-height:1.2em;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:50px;font-size:.76rem;font-weight:700;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.b1{background:var(--blue);color:#fff}.b2{background:var(--green);color:#fff}.b3{background:var(--amber);color:#fff}.b4{background:#fff;border:1.5px solid var(--bd);color:var(--mid)}.b5{background:var(--red);color:#fff}
.full{width:100%;padding:13px}
aside{width:240px;background:linear-gradient(180deg,#0B3D91,#07285F);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:100;display:flex;flex-direction:column;transition:transform .3s;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}.brand h1{font-size:1rem;line-height:1.1}.brand span{font-size:.65rem;opacity:.7}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.75);font-size:.82rem;font-weight:600;width:100%;text-align:left;margin-bottom:3px}
.nl i{width:18px;text-align:center}.nl:hover{background:rgba(255,255,255,.08)}.nl.on{background:rgba(255,255,255,.16);color:#fff}
.nl b{margin-left:auto;background:var(--red);font-size:.62rem;padding:1px 8px;border-radius:50px}
main{margin-left:240px;padding:20px 24px 40px;max-width:1300px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top div.t{flex:1;min-width:180px}.top h2{font-size:1.4rem}.top p{font-size:.8rem;color:var(--soft)}
.conn{font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:50px;background:var(--gl);color:var(--gd)}.conn.off{background:var(--rl);color:var(--red)}
.ham{display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1.5px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.sc{background:#fff;border:1.5px solid var(--bd);border-radius:20px;padding:16px}
.sc i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sc h3{font-size:1.6rem;line-height:1.1}.sc p{font-size:.72rem;color:var(--soft);font-weight:600}.sc small{font-size:.68rem;color:var(--gd);font-weight:600}
.panel{background:#fff;border:1.5px solid var(--bd);border-radius:20px;margin-bottom:16px;overflow:hidden}
.ph{padding:14px 18px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ph h3{font-size:.95rem;flex:1}
.pb{padding:16px 18px}.cw{position:relative;height:260px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px}.bar input{flex:1;min-width:170px;margin:0}.bar select{width:auto;margin:0}.bar small{color:var(--soft);font-size:.72rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:10px 14px;background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--bd);color:var(--mid)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--bl)}
.empty{text-align:center;color:var(--soft);padding:40px!important;cursor:default}
.pill{display:inline-block;padding:2px 10px;border-radius:50px;font-size:.68rem;font-weight:700;white-space:nowrap}
.pill.red{background:var(--rl);color:var(--red)}.pill.green{background:var(--gl);color:var(--gd)}.pill.amber{background:var(--al);color:#C45F00}.pill.blue{background:var(--bl);color:var(--blue)}.pill.gray{background:#EEF1F5;color:var(--soft)}
.ov{position:fixed;inset:0;background:rgba(13,27,42,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}.ov.on{display:flex}
.md{background:#fff;border-radius:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
.mh{padding:16px 20px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center}.mh h3{flex:1;font-size:1rem}
.dr{padding:9px 20px;border-bottom:1px solid var(--bd);font-size:.84rem}.dr small{display:block;font-size:.66rem;font-weight:700;color:var(--soft);text-transform:uppercase}.dr span{word-break:break-word}
.mf{padding:14px 20px 20px;display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;top:16px;right:16px;background:var(--ink);color:#fff;font-size:.8rem;padding:11px 18px;border-radius:50px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}#toast.on{opacity:1}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.on{transform:none}main{margin-left:0;padding:14px}.ham{display:block}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lform" autocomplete="on">
    <img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt="BANDUL">
    <h1>BANDUL Admin</h1><p>Khusus petugas — masuk dengan akun admin</p>
    <input id="lemail" type="email" placeholder="Email admin" autocomplete="username" required>
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password" required>
    <div id="lerr" role="alert"></div>
    <button class="btn b1 full" id="lbtn" type="submit"><i class="fas fa-right-to-bracket"></i> Masuk</button>
    <button class="btn b4 full" id="lreset" type="button" style="margin-top:8px">Lupa password?</button>
  </form>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><img src="https://fesbukbantennews.com/wp-content/uploads/2026/06/Logo-fbn-bulat.png" alt=""><div><h1>BANDUL Admin</h1><span>Monitoring · Banten Peduli</span></div></div>
    <nav id="nav"></nav>
    <div style="margin-top:auto;padding-top:14px"><div id="who" style="font-size:.68rem;opacity:.7;word-break:break-all;margin-bottom:8px"></div>
      <button class="nl" id="logout"><i class="fas fa-right-from-bracket"></i> Keluar</button></div>
  </aside>
  <main>
    <div class="top">
      <button class="ham" id="ham" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <div class="t"><h2 id="title">Dashboard</h2><p id="sub"></p></div>
      <span class="conn" id="conn">● Live</span>
      <button class="btn b4" id="exp"><i class="fas fa-file-csv"></i> Export CSV</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
'use strict';
/* ═══ KONFIGURASI — harus SAMA dengan index.html BANDUL ═══ */
const CFG = { firebase: {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain: "bandul-app.firebaseapp.com",
  projectId: "bandul-app",
  storageBucket: "bandul-app.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef1234567890" } };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tt; const toast = (m, ms = 3000) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms); };
const dt = ts => ts && ts.toDate ? ts.toDate() : ts ? new Date(ts) : null;
const tm = ts => { const d = dt(ts); return d ? d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; };
const pill = (t, c = 'blue') => `<span class="pill ${c}">${esc(t || '—')}</span>`;
const stPill = s => pill(s || 'baru', { baru: 'red', diproses: 'amber', selesai: 'green' }[s || 'baru'] || 'gray');
const mp = r => r.lat ? `<a href="https://www.google.com/maps?q=${esc(r.lat)},${esc(r.lng)}" target="_blank" rel="noopener" style="color:var(--blue)">📍 Peta</a>` : '—';
const who = r => esc(r.email || 'Anonim');

let db, auth;
try { firebase.initializeApp(CFG.firebase); auth = firebase.auth(); db = firebase.firestore(); }
catch (e) { $('lerr').textContent = 'Firebase belum dikonfigurasi dengan benar.'; }

/* Definisi koleksi — nama & field sama dengan index.html BANDUL */
const COL = {
  reports:          { t: 'Laporan Darurat',     i: 'fa-file-medical',        sub: 'Semua laporan bencana yang masuk', st: 1, order: 'createdAt', cols: [['Waktu', r => tm(r.createdAt)], ['Pelapor', who], ['Jenis', r => pill(r.jenis)], ['Lokasi', mp], ['Audio', r => r.audio ? '🎙️' : '—'], ['Status', r => stPill(r.status)]] },
  layanan_requests: { t: 'Permintaan Layanan',  i: 'fa-hands-holding-heart', sub: 'Permintaan bantuan medis & sosial', st: 1, order: 'createdAt', cols: [['Waktu', r => tm(r.createdAt)], ['Pemohon', who], ['Layanan', r => pill(r.jenis, 'amber')], ['WA Tujuan', r => r.waTarget ? `<a href="https://wa.me/${esc(r.waTarget)}" target="_blank" rel="noopener" style="color:var(--gd)">${esc(r.waTarget)}</a>` : '—'], ['Status', r => stPill(r.status)]] },
  partisipasi:      { t: 'Partisipasi',         i: 'fa-user-plus',           sub: 'Relawan, sumbangan, kendaraan', st: 1, order: 'createdAt', cols: [['Waktu', r => tm(r.createdAt)], ['Warga', who], ['Bentuk', r => pill(r.jenis, 'green')], ['Status', r => stPill(r.status)]] },
  relawan_contacts: { t: 'Klik Kontak Relawan', i: 'fa-phone',               sub: 'Riwayat tombol hubungi relawan', order: 'createdAt', cols: [['Waktu', r => tm(r.createdAt)], ['Pengguna', who], ['Relawan', r => esc(r.nama)], ['WA', r => esc(r.wa)], ['Konteks', r => esc(r.konteks)]] },
  users:            { t: 'Pengguna',            i: 'fa-users',               sub: 'Akun yang login (Google/email)', order: 'lastSeen', cols: [['Email', r => `<b>${esc(r.email)}</b>`], ['Nama', r => esc(r.name)], ['Terakhir Aktif', r => tm(r.lastSeen)]] }
};
const D = {}; Object.keys(COL).forEach(k => D[k] = []);
let cur = 'dashboard', F = { q: '', s: '' }, unsubs = [], ready = {}, charts = {};

/* ═══ AUTH ═══ */
$('lform').onsubmit = async e => {
  e.preventDefault(); if (!auth) return;
  $('lerr').textContent = ''; $('lbtn').disabled = true;
  try { await auth.signInWithEmailAndPassword($('lemail').value.trim(), $('lpass').value); }
  catch (er) {
    const m = { 'auth/invalid-credential': 'Email atau password salah.', 'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.', 'auth/network-request-failed': 'Tidak ada koneksi internet.', 'auth/operation-not-allowed': 'Aktifkan Email/Password di Firebase Authentication.' };
    $('lerr').textContent = m[er.code] || 'Gagal masuk (' + (er.code || 'error') + ')';
  }
  $('lbtn').disabled = false;
};
$('lreset').onclick = () => {
  const em = $('lemail').value.trim(); if (!em) return $('lerr').textContent = 'Isi email admin terlebih dahulu.';
  auth.sendPasswordResetEmail(em).then(() => toast('📧 Jika akun ada, tautan reset dikirim ke email')).catch(() => toast('⚠️ Gagal mengirim'));
};
$('logout').onclick = () => auth.signOut();
if (auth) auth.onAuthStateChanged(u => {
  if (u && !u.isAnonymous) { $('login').classList.add('hide'); $('app').classList.remove('hide'); $('who').textContent = u.email; start(); }
  else { stop(); $('app').classList.add('hide'); $('login').classList.remove('hide'); $('lpass').value = ''; }
});

/* ═══ LISTENER REALTIME (hanya setelah login) ═══ */
function start() {
  stop(); buildNav(); show('dashboard');
  Object.keys(COL).forEach(c => {
    const un = db.collection(c).orderBy(COL[c].order, 'desc').limit(500).onSnapshot(snap => {
      D[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (ready[c] && c === 'reports') snap.docChanges().forEach(ch => { if (ch.type === 'added' && !ch.doc.metadata.hasPendingWrites) toast('🚨 Laporan baru: ' + (ch.doc.data().jenis || '-'), 6000); });
      ready[c] = true; conn(true); badges();
      if (cur === 'dashboard') dash(); else if (cur === c) fill();
    }, err => {
      if (err.code === 'permission-denied') { toast('⛔ Akses ditolak: akun ini bukan admin / Rules belum diatur', 6000); auth.signOut(); }
      else conn(false);
    });
    unsubs.push(un);
  });
}
function stop() { unsubs.forEach(u => u()); unsubs = []; ready = {}; Object.values(charts).forEach(c => c && c.destroy()); charts = {}; }
function conn(ok) { const c = $('conn'); c.classList.toggle('off', !ok); c.textContent = ok ? '● Live' : '● Terputus'; }

/* ═══ NAVIGASI ═══ */
function buildNav() {
  $('nav').innerHTML = `<button class="nl on" data-s="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>` +
    Object.entries(COL).map(([k, c]) => `<button class="nl" data-s="${k}"><i class="fas ${c.i}"></i> ${c.t}<b class="hide" id="bd-${k}">0</b></button>`).join('');
}
function badges() {
  const n = D.reports.filter(r => !r.status || r.status === 'baru').length, b = $('bd-reports');
  if (b) { b.textContent = n; b.classList.toggle('hide', !n); }
}
$('nav').onclick = e => { const b = e.target.closest('[data-s]'); if (b) show(b.dataset.s); };
$('ham').onclick = () => $('side').classList.toggle('on');

function show(s) {
  cur = s; F = { q: '', s: '' }; $('side').classList.remove('on');
  document.querySelectorAll('.nl[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  if (s === 'dashboard') { $('title').textContent = 'Dashboard'; $('sub').textContent = 'Ringkasan aktivitas aplikasi BANDUL'; dash(); return; }
  const c = COL[s]; $('title').textContent = c.t; $('sub').textContent = c.sub;
  $('view').innerHTML = `<div class="panel"><div class="bar"><input id="fq" type="search" placeholder="🔍 Cari…">${c.st ? `<select id="fs"><option value="">Semua status</option><option value="baru">Baru</option><option value="diproses">Diproses</option><option value="selesai">Selesai</option></select>` : ''}<small id="cnt"></small></div>
  <div class="tw"><table><thead><tr>${c.cols.map(k => `<th>${k[0]}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div></div>`;
  $('fq').oninput = e => { F.q = e.target.value.toLowerCase(); fill(); };
  if ($('fs')) $('fs').onchange = e => { F.s = e.target.value; fill(); };
  fill();
}
function rows() {
  let a = D[cur];
  if (F.q) a = a.filter(r => JSON.stringify(r).toLowerCase().includes(F.q));
  if (F.s) a = a.filter(r => (r.status || 'baru') === F.s);
  return a;
}
function fill() {
  const c = COL[cur], a = rows();
  $('cnt').textContent = a.length + ' data';
  $('tb').innerHTML = a.length ? a.map(r => `<tr data-id="${esc(r.id)}">${c.cols.map(k => `<td>${k[1](r)}</td>`).join('')}</tr>`).join('') : `<tr><td class="empty" colspan="9"><i class="fas fa-inbox" style="font-size:2rem;opacity:.4"></i><br>Tidak ada data</td></tr>`;
}
$('view').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('a')) detail(tr.dataset.id, tr.closest('#rc') ? 'reports' : cur); };

/* ═══ DASHBOARD ═══ */
function dash() {
  const today = ts => { const d = dt(ts), n = new Date(); return d && d.toDateString() === n.toDateString(); };
  const card = (ic, col, bg, n, lbl, sm) => `<div class="sc"><i class="fas ${ic}" style="background:${bg};color:${col}"></i><h3>${n}</h3><p>${lbl}</p><small>${sm}</small></div>`;
  const r = D.reports, baru = r.filter(x => !x.status || x.status === 'baru').length, recent = r.slice(0, 8);
  $('view').innerHTML = `<div class="stats">
    ${card('fa-file-medical', '#D62828', '#FFF0F0', r.length, 'Total Laporan', r.filter(x => today(x.createdAt)).length + ' hari ini · ' + baru + ' baru')}
    ${card('fa-hands-holding-heart', '#C45F00', '#FFF6EE', D.layanan_requests.length, 'Permintaan Layanan', D.layanan_requests.filter(x => today(x.createdAt)).length + ' hari ini')}
    ${card('fa-user-plus', '#1A9E3F', '#EDFBF2', D.partisipasi.length, 'Partisipasi Warga', D.partisipasi.filter(x => today(x.createdAt)).length + ' hari ini')}
    ${card('fa-users', '#0B3D91', '#EEF4FF', D.users.length, 'Pengguna Login', D.users.filter(x => today(x.lastSeen)).length + ' aktif hari ini')}</div>
  <div class="panel"><div class="ph"><h3>📈 Tren Laporan 7 Hari</h3></div><div class="pb"><div class="cw"><canvas id="c1"></canvas></div></div></div>
  <div class="panel"><div class="ph"><h3>🥧 Jenis Kejadian</h3></div><div class="pb"><div class="cw"><canvas id="c2"></canvas></div></div></div>
  <div class="panel"><div class="ph"><h3>⚡ Laporan Terbaru</h3><button class="btn b4" onclick="show('reports')">Lihat semua →</button></div>
  <div class="tw"><table><thead><tr>${COL.reports.cols.map(k => `<th>${k[0]}</th>`).join('')}</tr></thead><tbody id="rc">${recent.length ? recent.map(x => `<tr data-id="${esc(x.id)}">${COL.reports.cols.map(k => `<td>${k[1](x)}</td>`).join('')}</tr>`).join('') : '<tr><td class="empty" colspan="9">Belum ada laporan</td></tr>'}</tbody></table></div></div>`;
  if (typeof Chart === 'undefined') return;
  Object.values(charts).forEach(c => c && c.destroy());
  const lab = [], cnt = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); lab.push(d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })); cnt.push(r.filter(x => { const t = dt(x.createdAt) || new Date(); return t.toDateString() === d.toDateString(); }).length); }
  charts.a = new Chart($('c1'), { type: 'line', data: { labels: lab, datasets: [{ data: cnt, borderColor: '#0B3D91', backgroundColor: 'rgba(11,61,145,.12)', fill: true, tension: .4, borderWidth: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  const jm = {}; r.forEach(x => { const j = x.jenis || 'Lainnya'; jm[j] = (jm[j] || 0) + 1; });
  charts.b = new Chart($('c2'), { type: 'doughnut', data: { labels: Object.keys(jm).length ? Object.keys(jm) : ['Belum ada'], datasets: [{ data: Object.keys(jm).length ? Object.values(jm) : [1], backgroundColor: ['#D62828', '#1557C0', '#00838F', '#7B5E2A', '#F4A261', '#7C3AED', '#2DC653', '#7A94AB'], borderColor: '#fff', borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right' } } } });
}

/* ═══ DETAIL & AKSI ═══ */
const LBL = { createdAt: 'Diterima', updatedAt: 'Diperbarui', lastSeen: 'Terakhir aktif', jenis: 'Jenis', kronologi: 'Kronologi', pesan: 'Pesan', waTarget: 'WA tujuan', tanggal: 'Waktu kejadian', audio: 'Ada rekaman', nama: 'Nama', wa: 'WA', konteks: 'Konteks', email: 'Email', name: 'Nama', status: 'Status', device: 'Perangkat', uid: 'UID' };
function detail(id, coll) {
  const r = (D[coll] || []).find(x => x.id === id); if (!r) return; const c = COL[coll];
  const val = (k, v) => /At$|lastSeen|firstSeen/.test(k) ? tm(v) : k === 'device' && v ? esc((v.mobile ? 'Mobile' : 'Desktop') + ' · ' + (v.ua || '')) : k === 'status' ? stPill(v) : k === 'audio' ? (v ? 'Ya (dilampirkan via WhatsApp)' : 'Tidak') : esc(v);
  $('md').innerHTML = `<div class="mh"><h3>${esc(c.t)}</h3><button class="btn b4" id="mx" aria-label="Tutup"><i class="fas fa-times"></i></button></div>` +
    Object.entries(r).filter(([k]) => !['id', 'lat', 'lng'].includes(k)).map(([k, v]) => `<div class="dr"><small>${esc(LBL[k] || k)}</small><span>${val(k, v)}</span></div>`).join('') +
    (r.lat ? `<div class="dr"><small>Koordinat</small><span><a href="https://www.google.com/maps?q=${esc(r.lat)},${esc(r.lng)}" target="_blank" rel="noopener" style="color:var(--blue)">${esc(r.lat)}, ${esc(r.lng)} → Buka peta</a></span></div>` : '') +
    `<div class="mf">${c.st ? `<button class="btn b3" data-a="diproses"><i class="fas fa-spinner"></i> Diproses</button><button class="btn b2" data-a="selesai"><i class="fas fa-check"></i> Selesai</button>` : ''}${r.email ? `<a class="btn b1" href="mailto:${esc(r.email)}"><i class="fas fa-envelope"></i> Email</a>` : ''}<button class="btn b5" data-a="del"><i class="fas fa-trash"></i> Hapus</button></div>`;
  $('ov').classList.add('on');
  $('mx').onclick = closeM;
  $('md').querySelector('.mf').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    try {
      if (b.dataset.a === 'del') { if (!confirm('Hapus data ini permanen?')) return; await db.collection(coll).doc(id).delete(); toast('🗑️ Dihapus'); }
      else { await db.collection(coll).doc(id).update({ status: b.dataset.a, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); toast('✅ Status: ' + b.dataset.a); }
      closeM();
    } catch (er) { toast('❌ Gagal: ' + (er.code || er.message)); }
  };
}
const closeM = () => $('ov').classList.remove('on');
$('ov').onclick = e => { if (e.target.id === 'ov') closeM(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

/* ═══ EXPORT CSV (aman dari CSV-injection) ═══ */
$('exp').onclick = () => {
  const name = cur === 'dashboard' ? 'reports' : cur, a = D[name];
  if (!a.length) return toast('⚠️ Tidak ada data');
  const keys = [...new Set(a.flatMap(Object.keys))];
  const cell = v => { if (v && v.toDate) v = v.toDate().toISOString(); else if (v && typeof v === 'object') v = JSON.stringify(v); v = String(v ?? ''); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const csv = [keys.join(','), ...a.map(r => keys.map(k => cell(r[k])).join(','))].join('\n');
  const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  l.download = 'bandul_' + name + '_' + new Date().toISOString().slice(0, 10) + '.csv'; l.click(); toast('📥 CSV terunduh');
};
